<style data-mq>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F6F4; --surface:#FFFFFF; --surface-2:#E7F1EE; --ink:#152420; --muted:#5B6E68; --line:#DAE5E1;
  --accent:#0B6E6E; --accent-ink:#FFFFFF; --accent-soft:#DEF0ED;
  --gold:#9C6B12; --gold-soft:#FBF0DA;
  --good:#1E7A4C; --good-bg:#E1F4E9; --bad:#B23B3B; --bad-bg:#FBE6E6;
  --r:14px; --shadow:0 1px 2px rgba(15,30,25,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1613; --surface:#152420; --surface-2:#1B2C27; --ink:#EAF2EF; --muted:#93A6A0; --line:#25382F;
    --accent:#48D0C0; --accent-ink:#06231E; --accent-soft:#173731;
    --gold:#D9A94B; --gold-soft:#2E2409;
    --good:#5FD98E; --good-bg:#12331F; --bad:#F0A0A0; --bad-bg:#3A1717;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#152420; --surface-2:#1B2C27; --ink:#EAF2EF; --muted:#93A6A0; --line:#25382F;
  --accent:#48D0C0; --accent-ink:#06231E; --accent-soft:#173731;
  --gold:#D9A94B; --gold-soft:#2E2409;
  --good:#5FD98E; --good-bg:#12331F; --bad:#F0A0A0; --bad-bg:#3A1717;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;
  font-family:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI","Noto Sans Arabic","Tahoma","Arial",system-ui,sans-serif;font-size:16px;line-height:1.65;
  -webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
.num{font-family:"Markazi Text","IBM Plex Sans Arabic","Geeza Pro","Segoe UI","Tahoma",serif;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:700}
p{margin:0}
a{color:inherit}
::selection{background:var(--accent-soft)}

/* ---- chrome ---- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-row{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px}
.brand .mark{flex:none;line-height:0}
.brand-txt{display:flex;flex-direction:column;line-height:1.2}
.brand-store{font-size:11px;color:var(--muted);font-weight:600}
.brand-product{font-size:16.5px;font-weight:700;color:var(--ink)}

/* dashboard brand hero */
.brand-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
.brand-hero-store{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--line)}
.bh-store-name{font-weight:700;font-size:15px}
.bh-tagline{font-size:12px;color:var(--muted);margin-top:2px}
.brand-hero-product{text-align:center}
.bh-product-name{font-size:23px;font-weight:700;color:var(--accent)}
.bh-product-tag{font-size:13px;color:var(--muted);margin-top:3px}

.promo{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin:4px 0 18px;background:#fff}
/* question / explanation frame */
.qframe{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.qframe-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.qframe-brand{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.qframe-product{font-weight:700;font-size:13.5px;color:var(--accent);white-space:nowrap}
.qframe-body{padding:16px}
.qframe-meta{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:4px 16px}
.qframe-meta b{color:var(--ink);font-weight:600}
.qframe-meta span{transition:color .3s ease}
.qframe-meta span.warn b, .qframe-meta span.warn{color:var(--bad)}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.qframe{animation:fadeInUp .28s ease}
.result-hero{animation:fadeInUp .32s ease}
.opt{transition:transform .12s ease,border-color .15s ease,background-color .15s ease}
.opt:active{transform:scale(.98)}
.btn{transition:transform .1s ease,opacity .15s ease}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.progress-fill{transition:width .35s ease}
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,18,.45);display:flex;align-items:center;justify-content:center;
  z-index:50;padding:20px;animation:fadeInUp .15s ease}
.modal-card{background:var(--surface);border-radius:var(--r);padding:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.modal-card h3{font-size:17px;margin-bottom:8px}
.modal-card p{font-size:14.5px;color:var(--muted);line-height:1.7}
.spacer{flex:1}
.iconbtn{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:focus-visible,.tile:focus-visible,.opt:focus-visible,.btn:focus-visible,.chip:focus-visible,.link-row a:focus-visible{
  outline:3px solid var(--accent);outline-offset:2px}
.backbtn{display:flex;align-items:center;gap:6px;border:none;background:none;color:var(--ink);
  font-size:15px;cursor:pointer;padding:6px 2px}
main{max-width:880px;margin:0 auto;padding:18px 16px 56px}
.hidden{display:none !important}

/* ---- buttons / chips ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;
  padding:13px 20px;font-size:16px;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-wide{width:100%}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
  padding:8px 16px;font-size:14.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}

/* ---- dashboard ---- */
.hello{font-size:22px;margin-bottom:2px}
.hello-sub{color:var(--muted);font-size:14.5px;margin-bottom:20px}
.goalcard{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-inline-start:4px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-bottom:18px;flex-wrap:wrap}
.goalcard .gic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;flex:none}
.goalcard .gbody{flex:1;min-width:140px}
.goalcard .glabel{font-size:12.5px;color:var(--muted)}
.goalcard .gval{font-size:26px;font-weight:700}
.goalcard .gmsg{font-size:13.5px;color:var(--muted);margin-top:3px}
.goalcard .glink{font-size:13.5px;color:var(--accent);cursor:pointer;text-decoration:none;white-space:nowrap}
.goalcard .gactions{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.level-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
  border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;margin-inline-start:8px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;
  text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:118px}
.tile:hover{border-color:var(--accent)}
.tile .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center}
.tile.primary{background:var(--accent);border-color:var(--accent)}
.tile.primary .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.tile.primary,.tile.primary .tile-d{color:var(--accent-ink)}
.tile-t{font-weight:700;font-size:15px}
.tile-d{font-size:12.5px;color:var(--muted);line-height:1.4}

.stats{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);margin-bottom:18px;overflow:hidden}
.stat{flex:1 1 130px;padding:14px 14px;border-inline-end:1px solid var(--line)}
.stat:last-child{border-inline-end:none}
.stat-v{font-size:22px;font-weight:700}
.stat-l{font-size:12.5px;color:var(--muted);margin-top:2px}

.note{border:1px solid var(--accent);border-inline-start-width:4px;background:var(--accent-soft);
  border-radius:10px;padding:14px 16px;margin-bottom:18px}
.note h3{font-size:15px;margin-bottom:5px}
.note p{font-size:14.5px;color:var(--ink)}
.note .btn{margin-top:10px}

.section-t{font-size:14px;color:var(--muted);margin:22px 0 8px;font-weight:600}
.bar-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.bar-l{flex:0 0 150px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--accent)}
.bar-v{flex:0 0 38px;font-size:12.5px;color:var(--muted);text-align:end}

.link-row{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px}
.link-row a{font-size:14px;color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--line);
  padding-bottom:2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.link-row a:hover{border-color:var(--accent);color:var(--accent)}

/* ---- setup ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.field{margin-bottom:18px}
.field-t{font-size:14.5px;font-weight:600;margin-bottom:9px}
.setup-actions{display:flex;gap:10px;margin-top:20px}
.hint{font-size:13.5px;color:var(--muted);margin-top:8px}

/* ---- quiz ---- */
.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:13.5px;color:var(--muted)}
.progress-track{flex:1;height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent)}
.timer{font-weight:700;color:var(--ink)}
.timer.low{color:var(--bad)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.qmeta span{background:var(--surface-2);border-radius:999px;padding:3px 10px}
.stem{font-size:19px;margin:0 0 14px;white-space:pre-line}
.fig{display:flex;justify-content:center;margin:0 0 16px;color:var(--ink);overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.tb{border-collapse:collapse;margin:0 auto 16px;font-size:15px}
.tb th,.tb td{border:1px solid var(--line);padding:5px 16px;text-align:center}
.tb th{background:var(--surface-2)}
.opts{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;
  padding:13px 14px;background:var(--surface);cursor:pointer;text-align:start;width:100%;font-size:16px;color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;
  font-size:13.5px;font-weight:700}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.solution{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.solution h4{font-size:13.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.solution p{font-size:15.5px}
.exp-status{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16.5px;margin:0 0 10px}
.exp-status.ok{color:var(--good)}
.exp-status.bad{color:var(--bad)}
.exp-correct{font-size:15px;margin:0 0 4px}
.exp-card{background:var(--surface-2);border-radius:10px;padding:10px 13px;margin-bottom:10px}
.exp-card h4{font-size:13.5px;margin:0 0 4px;font-weight:700;color:var(--ink)}
.exp-card p{font-size:15px;margin:0}
.qactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
bdi.m{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
sup{font-size:.7em;line-height:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.15;font-size:.92em}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:1.5px solid currentColor}

/* ---- results ---- */
.result-hero{text-align:center;padding:26px 10px 10px}
.result-score{font-size:64px;font-weight:700;line-height:1}
.result-tier{color:var(--accent);font-weight:600;margin-top:6px;font-size:16px}
.result-sub{color:var(--muted);font-size:14px;margin-top:4px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.kpi{flex:1 1 120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.kpi .v{font-size:21px;font-weight:700}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.streak-box{display:flex;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid var(--gold);
  border-radius:12px;padding:14px 16px;margin:16px 0}
.streak-box .ic{color:var(--gold)}
.streak-box b{font-size:19px}
.ach-toast{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin:14px 0;
  font-size:14.5px;display:flex;align-items:center;gap:10px}
.wrong-list{margin-top:8px;display:grid;gap:10px}
.wq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.wq-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.wq-stem{font-size:14.5px}
.wq-meta{font-size:12px;color:var(--muted);margin-top:3px}
.wq-body{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.wq.open .wq-body{display:block}
.wq-actions{display:flex;gap:14px;margin-top:8px;font-size:13.5px}
.wq-actions a{cursor:pointer;color:var(--accent);text-decoration:none}

/* ---- lists (mistakes / favorites / achievements) ---- */
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-stem{font-size:15px;flex:1}
.item-meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.item-actions{display:flex;gap:14px;margin-top:10px;font-size:13.5px}
.item-actions a{cursor:pointer;color:var(--accent);text-decoration:none}
.badge-count{background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:50px 14px;font-size:15px}
.empty .ic{color:var(--muted);margin-bottom:10px}

.ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:560px){.ach-grid{grid-template-columns:1fr}}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center}
.ach.locked{opacity:.45}
.ach .ic{width:42px;height:42px;border-radius:11px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;flex:none}
.ach-t{font-weight:700;font-size:14.5px}
.ach-d{font-size:12.5px;color:var(--muted);margin-top:2px}

.chart{width:100%;height:120px}
.sparkwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:8px}
</style>
</head>
<body>
<header class="top" data-mq>
  <div class="top-row">
    <button class="backbtn hidden" id="backBtn" aria-label="رجوع"></button>
    <div class="brand"><span class="mark" id="brandMark"></span>
      <span class="brand-txt"><span class="brand-store" id="brandStore"></span><span class="brand-product" id="brandTitle"></span></span>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn hidden" id="quizExitBtn" title="خروج من الاختبار" aria-label="خروج من الاختبار"></button>
    <button class="iconbtn" id="themeBtn" aria-label="تبديل المظهر"></button>
  </div>
</header>

/* ============ math text rendering (reused pattern from bank review) ============ */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function mathText(s){
  s = esc(s).replace(/\^\{([^}]*)\}/g,"<sup>$1</sup>");
  s = s.replace(/(^|[^\u0621-\u064A])([\u0633\u0635\u0639])(?![\u0621-\u064A])/g,"$1\uE000$2\uE001");
  const V = "\\uE000[\\u0633\\u0635\\u0639]\\uE001";
  const SUP = "<sup>[^<]*<\\/sup>";
  const start = "(?:[\\u2212\\-](?=[\\d\\u221A(\\u03C0\\uE000])|\\((?=[\\d\\u221A(\\u2212\\u03C0\\uE000])|[\\d\\u221A\\u00B2\\u03C0\\uE000]|"+SUP+")";
  const cont = "(?:"+V+"|[\\d\\s\\u221A+\\u2212\\-\\u00D7\\u00F7=()\\/.\\u00B2%\\u00B0\\u03C0]|"+SUP+")*";
  const re = new RegExp("(?:"+V+"|"+start+")"+cont,"g");
  s = s.replace(re, m=>{
    const t = m.replace(/[\s.]+$/,""), tail = m.slice(t.length);
    const inner = t.replace(/(\d+)\/(\d+)/g,'<span class="fr"><i>$1</i><i>$2</i></span>');
    return '<bdi class="m">'+inner+'</bdi>'+tail;
  });
  return s.replace(/\uE000/g,'<bdi dir="ltr">').replace(/\uE001/g,"</bdi>");
}
function tableHtml(t){
  return '<table class="tb"><thead><tr>'+t.head.map(h=>"<th>"+esc(h)+"</th>").join("")+"</tr></thead><tbody>"+
    t.rows.map(r=>"<tr>"+r.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
}

/* ============ Phase 4: unified per-question explanation ============ */
// Never invents idea / fastestMethod / commonMistake — a question keeps whatever it truly has,
// and anything missing simply doesn't render (see بند خامسًا: "لا تعرض نصوصًا وهمية").
function getExplanation(q){
  const e = q.explanation || {};
  return {
    correctAnswer: q.choices[L4.indexOf(q.answer)],
    idea: e.idea || q.idea || null,
    solution: e.solution || q.solution || null,
    fastestMethod: e.fastestMethod || q.fastestMethod || null,
    commonMistake: e.commonMistake || q.commonMistake || null,
  };
}
function explanationCoverageReport(){
  let full=0, solutionOnly=0, missingIdea=0, missingFastest=0, missingMistake=0;
  DATA.forEach(q=>{
    const e = getExplanation(q);
    if(e.idea && e.fastestMethod && e.commonMistake) full++;
    else if(e.solution) solutionOnly++;
    if(!e.idea) missingIdea++;
    if(!e.fastestMethod) missingFastest++;
    if(!e.commonMistake) missingMistake++;
  });
  return {total:DATA.length, full, solutionOnly, missingIdea, missingFastest, missingMistake};
}

/* ============ Phase 4: smart "سؤال مشابه" ============ */
const REPEATED_MISTAKE_THRESHOLD = 3;
function skillMistakeCount(lesson){ return ATT.filter(a=>a.lesson===lesson && !a.correct).length; }
function findSimilarQuestion(question, excludeIds){
  excludeIds = excludeIds || new Set();
  const pool = DATA.filter(q=>q.id!==question.id && !excludeIds.has(q.id));
  if(!pool.length) return null;
  const recently = recentIds(60);
  const correctCounts = {};
  ATT.forEach(a=>{ if(a.correct) correctCounts[a.qid] = (correctCounts[a.qid]||0)+1; });
  let best=null, bestScore=-Infinity;
  for(const q of pool){
    let s = 0;
    if(q.skill===question.skill) s += 1000;       // 1. نفس المهارة
    if(q.difficulty===question.difficulty) s += 100; // 2. نفس مستوى الصعوبة
    if(q.chapter===question.chapter) s += 10;      // 3. نفس الباب
    if(!recently.has(q.id)) s += 5;                // 4. لم يُحل مؤخرًا
    s -= Math.min(correctCounts[q.id]||0, 5);      // 6. تفضيل تجنّب سؤال أتقنه الطالب كثيرًا، عند وجود بديل
    if(s>bestScore){ bestScore=s; best=q; }
  }
  return best;
}
function startSimilarQuestion(q){
  const avoid = new Set([q.id, ...recentIds(30)]);
  let sq = findSimilarQuestion(q, avoid) || findSimilarQuestion(q, new Set([q.id]));
  if(!sq) return;
  startSession([sq], "similar");
}

/* ============ Cloud sync ============
   The claude.ai viewer (especially the mobile app) may not keep localStorage between openings.
   When the platform's per-viewer `db` is available, everything is mirrored there and merged back
   on open. Union-merge (never overwrite), so two devices converge and nothing is lost.
   No `db` (saved file, other host) => silently stays local-only. */
const CLOUD_ATT_SHARD = 300, CLOUD_HIST_SHARD = 10;
function uniqBy(arr, keyFn){ const m=new Map(); arr.forEach(x=>{ const k=keyFn(x); if(!m.has(k)) m.set(k,x); }); return [...m.values()]; }
function cloudPayloads(){
  const docs = {};
  docs.core = {savedAt:Date.now(), onboarded:!!load(GK.onboarded,false), profile:PROFILE, goal:GOAL, daily:DAILY, ach:ACH,
    fav:[...FAV], mis:MIS, diag:DIAG, sims:SIMS, readinessHist:READINESS_HISTORY,
    counts:{att:ATT.length, hist:ATTEMPT_HISTORY.length}};
  for(let i=0; i*CLOUD_ATT_SHARD<ATT.length; i++) docs["att"+i] = {items:ATT.slice(i*CLOUD_ATT_SHARD,(i+1)*CLOUD_ATT_SHARD)};
  for(let i=0; i*CLOUD_HIST_SHARD<ATTEMPT_HISTORY.length; i++) docs["hist"+i] = {items:ATTEMPT_HISTORY.slice(i*CLOUD_HIST_SHARD,(i+1)*CLOUD_HIST_SHARD)};
  return docs;
}
async function cloudPush(){
  if(!CLOUD.ready) return;
  if(CLOUD.busy){ CLOUD.dirty = true; return; }
  CLOUD.busy = true;
  try{
    do{
      CLOUD.dirty = false;
      const docs = cloudPayloads();
      for(const name of Object.keys(docs)){
        const body = docs[name];
        const sig = JSON.stringify(body, (k,v)=> k==="savedAt" ? undefined : v);
        if(CLOUD.last[name]===sig) continue;
        await CLOUD.db.doc(CLOUD.base+"/"+name).set(body);
        CLOUD.last[name] = sig;
      }
      CLOUD.lastSync = Date.now(); CLOUD.status = "متزامنة";
    } while(CLOUD.dirty);
  }catch(e){ CLOUD.status = "تعذّرت المزامنة (البيانات محفوظة محليًا)"; }
  CLOUD.busy = false;
}
function scheduleCloudPush(){ if(!CLOUD.ready) return; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudPush, 1500); }
function mergeCloud(c0, cAtt, cHist){
  const byTs = x=>x.ts;
  ATT = uniqBy([...ATT, ...cAtt], a=>a.qid+"|"+a.ts).sort((a,b)=>a.ts-b.ts);
  ATTEMPT_HISTORY = uniqBy([...ATTEMPT_HISTORY, ...cHist], h=>h.id).sort((a,b)=>a.completedAt-b.completedAt);
  DIAG = uniqBy([...DIAG, ...(c0.diag||[])], byTs).sort((a,b)=>a.ts-b.ts);
  SIMS = uniqBy([...SIMS, ...(c0.sims||[])], byTs).sort((a,b)=>a.ts-b.ts);
  READINESS_HISTORY = uniqBy([...READINESS_HISTORY, ...(c0.readinessHist||[])], byTs).sort((a,b)=>a.ts-b.ts);
  const mis = Object.assign({}, MIS);
  Object.keys(c0.mis||{}).forEach(k=>{ if(!mis[k] || c0.mis[k].count>mis[k].count) mis[k]=c0.mis[k]; });
  MIS = mis;
  FAV = new Set([...FAV, ...(c0.fav||[])]);
  Object.keys(c0.ach||{}).forEach(k=>{ if(!ACH[k] || c0.ach[k]<ACH[k]) ACH[k]=c0.ach[k]; });
  if(c0.daily){
    const cd = c0.daily;
    DAILY.best = Math.max(DAILY.best||0, cd.best||0);
    if((cd.lastDate||"") > (DAILY.lastDate||"")){ DAILY.lastDate = cd.lastDate; DAILY.streak = cd.streak; }
    DAILY.history = Object.assign({}, cd.history||{}, DAILY.history||{});
  }
  if(GOAL===null && c0.goal!=null) GOAL = c0.goal;
  if(c0.profile){
    if(!PROFILE.name && c0.profile.name) PROFILE.name = c0.profile.name;
    if(c0.profile.createdAt && (!PROFILE.createdAt || c0.profile.createdAt<PROFILE.createdAt)) PROFILE.createdAt = c0.profile.createdAt;
    if(!PROFILE.lastActiveAt) PROFILE.lastActiveAt = c0.profile.lastActiveAt;
  }
  if(c0.onboarded || PROFILE.name) save(GK.onboarded, true);
  persistAll();
}
async function cloudInit(){
  try{
    const c = (typeof window!=="undefined") ? window.claude : null;
    if(!c || !c.use){ CLOUD.status = "غير متاحة هنا (الحفظ محلي فقط)"; return; }
    const both = await Promise.all([c.use("db"), c.use("user")]);
    const db = both[0], user = both[1];
    if(!db || !user){ CLOUD.status = "غير متاحة هنا (الحفظ محلي فقط)"; return; }
    const uid = await user.id();
    if(!uid){ CLOUD.status = "غير متاحة هنا (الحفظ محلي فقط)"; return; }
    const base = "data/users/"+uid;
    const core = await db.doc(base+"/core").get();
    if(core.exists){
      const c0 = core.data();
      const cAtt = [], cHist = [];
      for(let i=0; i*CLOUD_ATT_SHARD < ((c0.counts&&c0.counts.att)||0); i++){
        const s = await db.doc(base+"/att"+i).get(); if(s.exists) cAtt.push(...((s.data().items)||[]));
      }
      for(let i=0; i*CLOUD_HIST_SHARD < ((c0.counts&&c0.counts.hist)||0); i++){
        const s = await db.doc(base+"/hist"+i).get(); if(s.exists) cHist.push(...((s.data().items)||[]));
      }
      mergeCloud(c0, cAtt, cHist);
    }
    CLOUD.db = db; CLOUD.base = base; CLOUD.ready = true; CLOUD.status = "متزامنة";
    updateStorageBanner();
    await cloudPush();
    const safeViews = ["welcome","profileSetup","dashboard","attemptsLog","journey","history","mistakes","favorites","achievements","about"];
    if(safeViews.indexOf(state.view)>=0){
      if((state.view==="welcome"||state.view==="profileSetup") && load(GK.onboarded,false) && PROFILE.name) state.view = "dashboard";
      render();
    }
  }catch(e){ CLOUD.status = "تعذّرت المزامنة (البيانات محفوظة محليًا)"; }
}
function getStudentProfile(){ return {name:PROFILE.name, createdAt:PROFILE.createdAt, lastActiveAt:PROFILE.lastActiveAt, targetScore:GOAL}; }
function studentName(){ return PROFILE.name || ""; }

/* ============ stats helpers ============ */
function todayStr(d){ d=d||new Date(); return d.toISOString().slice(0,10); }
function addDays(str,n){ const d=new Date(str+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function overallAccuracy(list){ list=list||ATT; if(!list.length) return null; return Math.round(100*list.filter(a=>a.correct).length/list.length); }
function avgTime(list){ list=list||ATT; if(!list.length) return null; return Math.round(list.reduce((s,a)=>s+a.ms,0)/list.length/1000); }
function levelTier(pct){
  if(pct<45) return "بحاجة إلى تأسيس";
  if(pct<65) return "مستوى متوسط";
  if(pct<85) return "مستوى جيد";
  return "مستوى متقدم";
}
function levelLabel(){
  const acc = overallAccuracy();
  if(acc===null || ATT.length<10) return "مستجد";
  return levelTier(acc);
}
function median(nums){
  const a = nums.slice().sort((x,y)=>x-y), n=a.length;
  if(!n) return 0;
  return n%2 ? a[(n-1)/2] : (a[n/2-1]+a[n/2])/2;
}
function timeCategories(answers){
  const times = answers.map(a=>a.ms);
  const med = median(times);
  // if every question took almost exactly the same time, a relative median gives no signal —
  // fall back to a fixed reference (45s) so a uniformly slow/fast session still classifies sensibly.
  const threshold = times.every(t=>Math.abs(t-times[0])<200) ? 45000 : med;
  const cats = {slowGood:0, fastBad:0, slowBad:0, fastGood:0};
  answers.forEach(a=>{
    const slow = a.ms > threshold;
    if(slow && a.correct) cats.slowGood++;
    else if(!slow && !a.correct) cats.fastBad++;
    else if(slow && !a.correct) cats.slowBad++;
    else cats.fastGood++;
  });
  return {med, cats};
}
function speedVerdict(cats, pct){
  const total = cats.slowGood+cats.fastBad+cats.slowBad+cats.fastGood;
  if(!total) return null;
  if(cats.fastBad/total>=0.35 && pct<65) return {label:"متسرّع بعض الشيء",
    text:"جزء كبير من إجاباتك جاء سريعًا لكنه غير دقيق. جرّب تتمهّل أكثر في قراءة المعطيات قبل الاختيار."};
  if(cats.slowBad/total>=0.35 && pct<65) return {label:"يحتاج مزيدًا من التأسيس",
    text:"استغرقت وقتًا أطول من المتوسط في أسئلة كثيرة دون أن يقابله دقة أعلى — التركيز على أساسيات المهارات الضعيفة أهم من السرعة الآن."};
  if(cats.slowGood/total>=0.4 && pct>=65) return {label:"دقيق لكنه بطيء",
    text:"دقتك جيدة، لكنك تأخذ وقتًا أطول من المعتاد. التدرّب على أسرع الطرق يساعدك تكسب وقتًا دون أن تفقد الدقة."};
  if(cats.fastGood/total>=0.4 && pct>=65) return {label:"سرعة ودقة متوازنتان",
    text:"توازن جيد بين السرعة والدقة في هذا الاختبار — استمر على هذا المستوى."};
  return {label:"أداء متوازن نسبيًا", text:"لا يوجد نمط زمني واحد مسيطر بعد — استمر في التدريب لنحصل على صورة أدق."};
}
function skillStats(list){
  list = list || ATT;
  const m = new Map();
  list.forEach(a=>{
    if(!m.has(a.lesson)) m.set(a.lesson,{total:0,correct:0});
    const s=m.get(a.lesson); s.total++; if(a.correct) s.correct++;
  });
  return m;
}
function skillTagFor(lesson){
  const st = skillStats().get(lesson);
  if(!st || st.total<SKILL_THRESHOLD) return null;
  const pct = Math.round(100*st.correct/st.total);
  return {pct, label: pct<65?"يحتاج تحسين":pct<85?"جيد":"متقدم"};
}
function lessonDifficultyCounts(lesson){
  const qs = byLesson.get(lesson);
  return {easy:qs.filter(q=>q.difficulty==="easy").length, medium:qs.filter(q=>q.difficulty==="medium").length,
    hard:qs.filter(q=>q.difficulty==="hard").length, all:qs.length};
}
function smartTrainingQuestions(count){
  const weak = weakestLessons(3,6).map(x=>x.lesson);
  const mistakeLessons = [...new Set(Object.keys(MIS).map(qid=>{ const q=byId.get(qid); return q&&q.lesson; }).filter(Boolean))];
  const lessons = [...new Set([...weak, ...mistakeLessons])];
  if(lessons.length) return sampleQuestions({lessons, count, excludeIds:recentIds()});
  return sampleQuestions({count, excludeIds:recentIds()});
}
function weakestLessons(minAttempts, topN){
  minAttempts = minAttempts||4;
  const m = skillStats();
  let arr = [...m.entries()].filter(([l,s])=>s.total>=minAttempts).map(([l,s])=>({lesson:l,pct:Math.round(100*s.correct/s.total),total:s.total}));
  arr.sort((a,b)=>a.pct-b.pct);
  return topN? arr.slice(0,topN) : arr;
}
function strongestWeakestPair(){
  const arr = weakestLessons(4);
  if(!arr.length) return null;
  return {weak:arr[0], strong:arr[arr.length-1]};
}
function recentIds(n){ n=n||120; return new Set(ATT.slice(-n).map(a=>a.qid)); }

/* ============ Phase 3: DATA_SUFFICIENCY + مؤشر الجاهزية ============ */
function countDistinctSessions(){
  // a "session" = a run of attempts with no gap longer than 20 minutes between consecutive ones.
  if(!ATT.length) return 0;
  const sorted = ATT.slice().sort((a,b)=>a.ts-b.ts);
  let n = 1;
  for(let i=1;i<sorted.length;i++){ if(sorted[i].ts - sorted[i-1].ts > 20*60*1000) n++; }
  return n;
}
function dataSufficiency(){
  const hasDiag = DIAG.length>0;
  const distinctSkills = new Set(ATT.map(a=>a.lesson)).size;
  const sessions = countDistinctSessions();
  const reasons = [];
  if(!hasDiag) reasons.push("أكمل الاختبار التشخيصي");
  if(ATT.length < DATA_SUFFICIENCY_RULES.minQuestions) reasons.push("واصل حل الأسئلة (" + ATT.length + "/" + DATA_SUFFICIENCY_RULES.minQuestions + ")");
  if(distinctSkills < DATA_SUFFICIENCY_RULES.minSkillsCovered) reasons.push("تدرّب على مهارات أكثر تنوعًا (" + distinctSkills + "/" + DATA_SUFFICIENCY_RULES.minSkillsCovered + ")");
  if(sessions < DATA_SUFFICIENCY_RULES.minSessions) reasons.push("واصل التدريب عبر أكثر من جلسة (" + sessions + "/" + DATA_SUFFICIENCY_RULES.minSessions + ")");
  return {ready: reasons.length===0, reasons, hasDiag, totalQuestions:ATT.length, distinctSkills, sessions};
}
function stdDev(arr){ if(!arr.length) return 0; const m=arr.reduce((a,b)=>a+b,0)/arr.length; return Math.sqrt(arr.reduce((a,b)=>a+(b-m)*(b-m),0)/arr.length); }

function accuracyFactor(){ const a=overallAccuracy(); return a===null?null:a/100; }
function skillFactorCalc(){
  const m = skillStats();
  const vals = [...m.values()].filter(s=>s.total>=SKILL_THRESHOLD).map(s=>s.correct/s.total);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function difficultyFactorCalc(){
  const byDiff = {easy:{c:0,t:0}, medium:{c:0,t:0}, hard:{c:0,t:0}};
  ATT.forEach(a=>{ const d=byDiff[a.difficulty]; if(!d) return; d.t++; if(a.correct) d.c++; });
  const vals = Object.values(byDiff).filter(d=>d.t>=3).map(d=>d.c/d.t);
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function timeFactorCalc(){
  if(ATT.length<5) return null;
  const {cats} = timeCategories(ATT);
  const total = cats.slowGood+cats.fastBad+cats.slowBad+cats.fastGood;
  if(!total) return null;
  const rushingRate = cats.fastBad/total;
  return Math.max(0, 1 - Math.min(1, rushingRate*2));
}
function simulationFactorCalc(){
  if(!SIMS.length) return null;
  const recent = SIMS.slice(-5);
  const vals = recent.map(s=>s.pct);
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  const weight = SIMS.length===1 ? 0.6 : 1; // a single simulation counts, but with reduced influence
  return {value: mean/100, mean, n:SIMS.length, weightFactor:weight, std: stdDev(vals)};
}
function consistencyFactorCalc(){
  const checkpoints = [...DIAG.map(d=>d.pct), ...SIMS.map(s=>s.pct)];
  if(checkpoints.length<2) return null;
  const sd = stdDev(checkpoints);
  return {value: Math.max(0, 1 - sd/30), sd, n:checkpoints.length};
}
function errorFactorCalc(){
  const wrongIds = Object.keys(MIS);
  if(wrongIds.length<3) return null;
  const repeated = wrongIds.filter(id=>MIS[id].count>=2).length;
  const ratio = repeated/wrongIds.length;
  return Math.max(0, 1 - Math.min(1, ratio*2));
}
function volumeFactorCalc(){ return Math.min(1, ATT.length/QUESTION_VOLUME_TARGET); }

let _readinessCache = null;
function computeReadiness(){
  // computeReadinessRaw does ~5 full passes over ATT/DIAG/SIMS/MIS internally, and gets called up to
  // 3x on a single dashboard/journey render — cache it per data-state so repeat calls in the same
  // render (or across renders where nothing changed) are free instead of redoing all that work.
  const key = ATT.length+","+DIAG.length+","+SIMS.length+","+Object.keys(MIS).length+","+READINESS_HISTORY.length;
  if(_readinessCache && _readinessCache.key===key) return _readinessCache.value;
  const value = computeReadinessRaw();
  _readinessCache = {key, value};
  return value;
}
function computeReadinessRaw(){
  const suff = dataSufficiency();
  if(!suff.ready) return {available:false, suff};
  const parts = {}, meta = {};
  const acc = accuracyFactor(); if(acc!==null) parts.accuracy = acc;
  const sk = skillFactorCalc(); if(sk!==null) parts.skill = sk;
  const df = difficultyFactorCalc(); if(df!==null) parts.difficulty = df;
  const tf = timeFactorCalc(); if(tf!==null) parts.time = tf;
  const simf = simulationFactorCalc(); if(simf){ parts.simulation = simf.value; meta.simulation = simf; }
  const cf = consistencyFactorCalc(); if(cf){ parts.consistency = cf.value; meta.consistency = cf; }
  const ef = errorFactorCalc(); if(ef!==null) parts.error = ef;
  parts.volume = volumeFactorCalc();

  let wsum=0, score=0;
  Object.keys(parts).forEach(k=>{
    let w = READINESS_WEIGHTS[k]||0;
    if(k==="simulation" && meta.simulation) w *= meta.simulation.weightFactor;
    wsum += w; score += parts[k]*w;
  });
  const pct = wsum>0 ? Math.round(100*score/wsum) : null;
  return {available: pct!==null, pct, parts, meta, suff};
}
function snapshotReadiness(){
  const r = computeReadiness();
  if(!r.available) return;
  READINESS_HISTORY.push({ts:Date.now(), pct:r.pct});
  if(READINESS_HISTORY.length>200) READINESS_HISTORY = READINESS_HISTORY.slice(-200);
  save(SK.readinessHist, READINESS_HISTORY);
}
function performanceTrend(){
  const checkpoints = [...DIAG.map(d=>({ts:d.ts,pct:d.pct})), ...SIMS.map(s=>({ts:s.ts,pct:s.pct}))].sort((a,b)=>a.ts-b.ts);
  if(checkpoints.length<3) return null;
  const first = checkpoints.slice(0,Math.ceil(checkpoints.length/2));
  const last = checkpoints.slice(Math.floor(checkpoints.length/2));
  const avg = arr => arr.reduce((a,b)=>a+b.pct,0)/arr.length;
  const diff = avg(last)-avg(first);
  if(diff>=6) return "up";
  if(diff<=-6) return "down";
  return "flat";
}
const FACTOR_LABELS = {accuracy:"الدقة", skill:"أداء المهارات", difficulty:"التوازن بين مستويات الصعوبة",
  time:"السرعة", simulation:"اختبارات المحاكاة", consistency:"ثبات الأداء", error:"تكرار الأخطاء", volume:"حجم التدريب"};
function factorTier(v){ return v>=0.75?"جيد": v>=0.5?"متوسط":"يحتاج إلى تحسين"; }

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function sampleQuestions({lessons, difficulties, count, excludeIds}){
  let pool = DATA;
  if(lessons && lessons.length) pool = pool.filter(q=>lessons.includes(q.lesson));
  if(difficulties && difficulties.length) pool = pool.filter(q=>difficulties.includes(q.difficulty));
  if(!pool.length) pool = DATA;
  const avoid = excludeIds || new Set();
  let fresh = shuffle(pool.filter(q=>!avoid.has(q.id)));
  let used = shuffle(pool.filter(q=>avoid.has(q.id)));
  let picked = fresh.concat(used).slice(0, count);
  if(picked.length < count){ // top up from whole bank if a narrow filter is too small
    const have = new Set(picked.map(q=>q.id));
    const extra = shuffle(DATA.filter(q=>!have.has(q.id)));
    picked = picked.concat(extra.slice(0, count-picked.length));
  }
  return shuffle(picked);
}
function diagnosticSet(count){
  // round-robin across all lessons/skills so the set is spread out even when count < number of lessons,
  // instead of silently degrading into a pure-random pick.
  let order = shuffle(LESSON_ORDER);
  const used = new Set();
  const picked = [];
  let guard = 0;
  while(picked.length < count && guard < count+LESSON_ORDER.length*3){
    for(const l of order){
      if(picked.length>=count) break;
      const pool = byLesson.get(l).filter(q=>!used.has(q.id));
      if(!pool.length) continue;
      const q = pool[Math.floor(Math.random()*pool.length)];
      used.add(q.id); picked.push(q);
    }
    order = shuffle(order);
    guard++;
  }
  return shuffle(picked).slice(0,count);
}
function pickBalanced(count, diffMix, exclude){
  // round-robins across every lesson in the bank (real coverage, not a hardcoded skill list),
  // while steering each pick toward the requested easy/medium/hard mix.
  diffMix = diffMix || {easy:1/3, medium:1/3, hard:1/3};
  const remaining = {easy: Math.round(count*diffMix.easy), medium: Math.round(count*diffMix.medium)};
  remaining.hard = count - remaining.easy - remaining.medium;
  const used = new Set(exclude||[]);
  let order = shuffle(LESSON_ORDER);
  const picked = [];
  let guard = 0;
  while(picked.length<count && guard<count+LESSON_ORDER.length*4){
    for(const l of order){
      if(picked.length>=count) break;
      const pool = byLesson.get(l).filter(q=>!used.has(q.id));
      if(!pool.length) continue;
      const wanted = Object.keys(remaining).filter(d=>remaining[d]>0);
      let candidates = wanted.length? pool.filter(q=>wanted.includes(q.difficulty)) : pool;
      if(!candidates.length) candidates = pool;
      const q = candidates[Math.floor(Math.random()*candidates.length)];
      used.add(q.id); picked.push(q);
      if(remaining[q.difficulty]>0) remaining[q.difficulty]--;
    }
    order = shuffle(order);
    guard++;
  }
  return shuffle(picked).slice(0,count);
}
function buildSimulationSections(){
  const usedIds = new Set();
  const sections = [];
  for(let i=1; i<=SIMULATION_CONFIG.numberOfSections; i++){
    const qs = pickBalanced(SIMULATION_CONFIG.questionsPerSection, SIMULATION_CONFIG.difficultyDistribution, usedIds);
    qs.forEach(q=>usedIds.add(q.id));
    sections.push({id:"s"+i, title:sectionTitle(i), seconds:SIMULATION_CONFIG.secondsPerSection, qs});
  }
  return sections;
}

/* ============ Phase 5: unified ATTEMPT_HISTORY (one rich record per completed session) ============ */
const ATTEMPT_TYPE_LABEL = {diagnostic:"اختبار تشخيصي", training:"تدريب", weakness:"تدريب نقاط الضعف",
  simulation:"محاكاة تدريبية", dailyChallenge:"التحدي اليومي"};
const MODE_TO_ATTEMPT_TYPE = {diagnostic:"diagnostic", practice:"training", weakness:"weakness", simulation:"simulation", daily:"dailyChallenge"};
function buildSkillBreakdown(answers){
  const m = {};
  answers.forEach(a=>{ const q=byId.get(a.qid); if(!q) return; const l=q.lesson;
    if(!m[l]) m[l]={total:0,correct:0}; m[l].total++; if(a.correct) m[l].correct++; });
  Object.keys(m).forEach(l=>{ m[l].pct = Math.round(100*m[l].correct/m[l].total); });
  return m;
}
function buildDifficultyBreakdown(answers){
  const m = {easy:{total:0,correct:0}, medium:{total:0,correct:0}, hard:{total:0,correct:0}};
  answers.forEach(a=>{ const q=byId.get(a.qid); if(!q || !m[q.difficulty]) return; const d=m[q.difficulty]; d.total++; if(a.correct) d.correct++; });
  Object.keys(m).forEach(d=>{ m[d].pct = m[d].total? Math.round(100*m[d].correct/m[d].total) : null; });
  return m;
}
let _attemptIdSeq = 0;
function recordAttemptHistory(s){
  const type = MODE_TO_ATTEMPT_TYPE[s.mode];
  if(!type) return; // "similar" / "single" one-off follow-up questions are not logged as full attempts
  const total = s.qs.length, answered = s.answers.length;
  const correct = s.answers.filter(a=>a.correct).length;
  const totalTime = s.totalMs || s.answers.reduce((a,b)=>a+b.ms,0);
  const rec = {
    id: "att_"+Date.now()+"_"+(_attemptIdSeq++),
    type, date: todayStr(new Date(s.sessionStart)),
    startedAt: s.sessionStart, completedAt: s.finishedAt || Date.now(),
    totalQuestions: total, answeredQuestions: answered,
    correctAnswers: correct, incorrectAnswers: answered-correct,
    accuracy: answered? Math.round(100*correct/answered) : 0,
    totalTime, averageTime: answered? Math.round(totalTime/answered) : 0,
    skillBreakdown: buildSkillBreakdown(s.answers),
    difficultyBreakdown: buildDifficultyBreakdown(s.answers),
    questionResults: s.answers.map(a=>({qid:a.qid, correct:a.correct, ms:a.ms})),
    wrongQuestionIds: s.answers.filter(a=>!a.correct).map(a=>a.qid),
    levelAtTime: levelTier(answered? Math.round(100*correct/answered) : 0),
  };
  ATTEMPT_HISTORY.push(rec);
  save(SK.attemptHistory, ATTEMPT_HISTORY);
  return rec;
}
/* ============ "تطورك": compare this attempt with the last comparable one, and a neutral composite indicator ============ */
function previousComparableAttempt(rec){
  for(let i=ATTEMPT_HISTORY.length-2; i>=0; i--){
    if(ATTEMPT_HISTORY[i].type===rec.type) return ATTEMPT_HISTORY[i];
  }
  return null;
}
function improvementIndex(curr, prev){
  const dAcc = curr.accuracy - prev.accuracy; // higher is better
  const dTime = prev.averageTime - curr.averageTime; // positive = got faster = better
  const dErr = prev.incorrectAnswers - curr.incorrectAnswers; // positive = fewer errors = better
  const norm = (x, span)=> Math.max(-1, Math.min(1, x/span));
  const accN = norm(dAcc, 25);
  const timeN = norm(dTime, Math.max(5, prev.averageTime*0.4));
  const errN = norm(dErr, Math.max(2, prev.incorrectAnswers||3));
  const blended = (accN*0.5 + timeN*0.25 + errN*0.25); // -1..1
  const value = Math.round(50 + blended*50); // 0..100, 50 = no change
  let label;
  if(value>=62) label = "هناك تحسن واضح في أدائك مقارنة بمحاولاتك السابقة.";
  else if(value<=38) label = "أداؤك تراجع قليلًا في هذه المحاولة — طبيعي أحيانًا، واصل التدريب.";
  else label = "أداؤك مستقر، وما زالت بعض المهارات تحتاج إلى تدريب.";
  return {value: Math.max(0,Math.min(100,value)), label};
}
function progressCardHtml(rec){
  const prev = previousComparableAttempt(rec);
  if(!prev) return "";
  const imp = improvementIndex(rec, prev);
  const row = (label, a, b, unit, betterHigh)=>{
    const d = b-a;
    const good = d===0? null : (betterHigh? d>0 : d<0);
    const dTxt = d===0? "—" : (good? "تحسّن" : "تراجع") + (unit==="%"? ` (${d>0?"+":""}${d}${unit})` : "");
    const style = d===0? "" : (good? "color:var(--good)":"color:var(--bad)");
    return `<div class="bar-row"><span class="bar-l">${label}</span>
      <span style="font-size:13px;color:var(--muted)">${a}${unit} ← ${b}${unit}</span>
      <span style="font-size:12.5px;flex:none;${style}">${dTxt}</span></div>`;
  };
  return `<p class="section-t">تطورك</p>
    <div class="card" style="margin-bottom:14px">

      ${row("متوسط الزمن", Math.round(prev.averageTime/1000), Math.round(rec.averageTime/1000), "ث", false)}
      ${row("الأخطاء", prev.incorrectAnswers, rec.incorrectAnswers, "", false)}
      <div class="bar-row"><span class="bar-l">مؤشر التطور</span>
        <span class="bar-track"><span class="bar-fill" style="width:${imp.value}%"></span></span>
        <span class="bar-v num">${imp.value}%</span></div>
      <p class="hint" style="margin-top:10px">${esc(imp.label)}</p>
    </div>`;
}
function relativeDateLabel(dateStr){
  const today = todayStr();
  if(dateStr===today) return "اليوم";
  if(dateStr===addDays(today,-1)) return "أمس";
  const diffDays = Math.round((new Date(today+"T00:00:00Z") - new Date(dateStr+"T00:00:00Z"))/86400000);
  if(diffDays>=0 && diffDays<=30) return `قبل ${diffDays} ${diffDays===1?"يوم":"أيام"}`;
  return dateStr;
}
function fmtDuration(ms){ const s=Math.max(0,Math.round(ms/1000)); const m=Math.floor(s/60); const sec=s%60; return `${m}:${String(sec).padStart(2,"0")}`; }
function attemptsTrend(){
  if(ATTEMPT_HISTORY.length<3) return null;
  const chron = ATTEMPT_HISTORY.slice().sort((a,b)=>a.completedAt-b.completedAt);
  const vals = chron.map(a=>a.accuracy);
  const sd = stdDev(vals);
  if(sd>18) return "volatile";
  const first = vals.slice(0, Math.ceil(vals.length/2));
  const last = vals.slice(Math.floor(vals.length/2));
  const avg = arr=>arr.reduce((a,b)=>a+b,0)/arr.length;
  const diff = avg(last)-avg(first);
  if(diff>=6) return "up";
  if(diff<=-6) return "down";
  return "flat";
}

/* ============ رحلتي نحو هدفي ============ */
function sparklineSvg(vals, w, h){
  w=w||560; h=h||110; const pad=8;
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const span = (mx-mn)||1;
  const pts = vals.map((v,i)=>{
    const x = pad + i*(w-2*pad)/(Math.max(1,vals.length-1));
    const y = h-pad - ((v-mn)/span)*(h-2*pad);
    return [x,y];
  });
  const path = pts.map(p=>p.join(",")).join(" ");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--accent)"/>`).join("")}
  </svg>`;
}
function readinessExplain(r){
  const lines = [];
  if(r.parts.accuracy!==undefined) lines.push({l:"الدقة", t:factorTier(r.parts.accuracy)});
  const pair = strongestWeakestPair();
  if(pair){ lines.push({l:pair.weak.lesson, t:"تحتاج إلى تحسين"}); if(pair.strong.lesson!==pair.weak.lesson) lines.push({l:pair.strong.lesson, t:"جيد"}); }
  if(r.parts.time!==undefined) lines.push({l:"السرعة", t:factorTier(r.parts.time)});
  if(r.parts.difficulty!==undefined) lines.push({l:"التوازن بين مستويات الصعوبة", t:factorTier(r.parts.difficulty)});
  if(r.parts.simulation!==undefined){
    const simMeta = r.meta.simulation;
    lines.push({l:"اختبارات المحاكاة", t: (simMeta && simMeta.std>15) ? "الأداء متذبذب" : factorTier(r.parts.simulation)});
  }
  if(r.parts.consistency!==undefined) lines.push({l:"ثبات الأداء", t:factorTier(r.parts.consistency)});
  const blockers = Object.keys(r.parts).filter(k=>k!=="volume").sort((a,b)=>r.parts[a]-r.parts[b]).slice(0,3)
    .map(k=>FACTOR_LABELS[k]+" ("+factorTier(r.parts[k])+")");
  return {lines, blockers};
}
function nextStepRecommendation(){
  if(!ATT.length) return null;
  const bySkillAll = skillStats();
  const skillArr = [...bySkillAll.entries()].map(([l,st])=>({lesson:l,pct:Math.round(100*st.correct/st.total),total:st.total})).sort((a,b)=>a.pct-b.pct);
  const weakSkills = skillArr.filter(x=>x.pct<65);
  const {cats} = timeCategories(ATT);
  const total = cats.slowGood+cats.fastBad+cats.slowBad+cats.fastGood;
  const rushingRatio = total? cats.fastBad/total : 0;
  const slowGoodRatio = total? cats.slowGood/total : 0;
  if(weakSkills.length>=3) return {title:"خطة تدريب متنوعة", count:30, lessons:weakSkills.slice(0,4).map(x=>x.lesson),
    text:"لديك أكثر من مهارة تحتاج تحسينًا، فجلسة متنوعة تغطيها معًا أنسب الآن."};
  if(weakSkills.length>=1){ const w=weakSkills[0]; return {title:"تدرب على "+w.lesson, count:15, lessons:weakSkills.map(x=>x.lesson),
    text:"«"+w.lesson+"» أضعف مهاراتك حاليًا بدقة "+w.pct+"%."}; }
  if(rushingRatio>=0.3) return {title:"تدريب الدقة", count:20, lessons:null,
    text:"سرعتك جيدة، لكن لديك أخطاء مرتبطة بالتسرع — جلسة تركّز على التأني تساعدك الآن."};
  if(slowGoodRatio>=0.4) return {title:"تدريب السرعة", count:20, lessons:null,
    text:"دقتك جيدة، لكن بعض المهارات تحتاج إلى رفع سرعة الحل."};
  return {title:"واصل التدريب العام", count:20, lessons:null, text:"أداؤك متوازن حاليًا — استمر لجمع مزيد من البيانات."};
}

function barRow(label,pct){
  const color = pct>=80?"var(--good)":pct>=55?"var(--accent)":"var(--bad)";
  return `<div class="bar-row"><span class="bar-l">${esc(label)}</span>
    <span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${color}"></span></span>
    <span class="bar-v num">${pct}%</span></div>`;
}

function resolveTrainQuestions(p){
  const avoid = recentIds();
  if(p.path==="smart") return smartTrainingQuestions(p.count);
  if(p.path==="all") return pickBalanced(p.count, {easy:1/3, medium:1/3, hard:1/3});
  if(p.path==="random") return sampleQuestions({count:p.count, excludeIds:avoid});
  if(p.path==="bySkill") return sampleQuestions({lessons:[p.lesson], difficulties: p.difficulty && p.difficulty!=="mixed"?[p.difficulty]:null, count:p.count, excludeIds:avoid});
  if(p.path==="weakSkill") return sampleQuestions({lessons:[p.lesson], count:p.count, excludeIds:avoid});
  if(p.path==="mistakes"){ const ids=Object.keys(MIS); return ids.map(id=>byId.get(id)).filter(Boolean); }
  return sampleQuestions({count:p.count||HUB_COUNT_DEFAULT, excludeIds:avoid});
}

  const p = state.params;
  if(p.path==="mistakes"){ p.count = Object.keys(MIS).length; }
  if(!p.count){ go("trainCount", p); return; }
  const levelTxt = p.lesson? `${esc(p.lesson)}${p.difficulty? " · "+DIFF_CHIP[p.difficulty].emoji+" "+DIFF_CHIP[p.difficulty].label:""}` : null;
  document.getElementById("app").innerHTML = `

      <button class="btn btn-primary btn-wide" id="hubStartBtn">🚀 ابدأ التدريب</button>
      <button class="btn btn-ghost" id="hubBackBtn">رجوع</button>
    </div>

}

      </div></div>`;
  } else if(mode==="weakness"){

    if(!arr.length){
      body = `<p style="color:var(--muted)">ما زلنا نجمع بيانات كافية عن مستواك في كل مهارة. جرّب اختبارًا تشخيصيًا أولًا، أو ابدأ جلسة مختلطة من الأسئلة الأصعب الآن.</p>`;
    } else {
      body = `<p style="color:var(--muted);margin-bottom:14px">بناءً على سجلّك، هذه أضعف مهاراتك حاليًا وسنركّز عليها في هذه الجلسة:</p>
        <div class="card" style="margin-bottom:16px">${arr.slice(0,5).map(s=>barRow(s.lesson,s.pct)).join("")}</div>
        <div class="field"><div class="field-t">عدد الأسئلة</div><div class="chiprow" id="countChips">
          ${TRAINING_COUNT_OPTIONS.map(n=>`<button class="chip" data-v="${n}" aria-pressed="${n===20}">${n} سؤال</button>`).join("")}
          <button class="chip" data-v="all" aria-pressed="false">الكل (شامل)</button>
        </div></div>`;

        <div class="bar-row"><span class="bar-l">زمن كل قسم</span><span style="color:var(--muted);font-size:13.5px;flex:none">${SIMULATION_CONFIG.minutesPerSection} دقائق</span></div>
      </div>
      <p class="hint">الإجمالي: ${SIMULATION_CONFIG.totalQuestions} سؤالًا في ${mins} دقيقة، موزّعة بتوازن على المهارات ومستويات الصعوبة.

      const n = Number(selected("countChips")||20);
      startSession(diagnosticSet(n), "diagnostic");
    } else if(mode==="practice"){
      const ch = selected("chChips"); const ls = selected("lsChips");

      let lessons = ls && ls!=="all" ? [ls] : (ch && ch!=="all" ? LESSON_ORDER.filter(l=>LESSON_CHAPTER.get(l)===ch) : null);
      let diffs = null;
      if(diff==="challenge"){ diffs=["hard"]; const w=weakestLessons(3,6).map(x=>x.lesson); if(w.length && !lessons) lessons=w; }
      else if(diff && diff!=="all") diffs=[diff];
      const rawN = selected("countChips")||"15";
      const n = rawN==="all" ? Math.max(1, DATA.filter(q=>(!lessons||lessons.includes(q.lesson))&&(!diffs||diffs.includes(q.difficulty))).length) : Number(rawN);
      startSession(sampleQuestions({lessons,difficulties:diffs,count:n,excludeIds:avoid}), "practice");
    } else if(mode==="weakness"){
      const arr = weakestLessons(3,6);
      const lessons = arr.length? arr.map(x=>x.lesson) : null;
      const diffs = arr.length? null : ["medium","hard"];
      const rawN = selected("countChips")||"15";
      const n = rawN==="all" ? Math.max(1, DATA.filter(q=>(!lessons||lessons.includes(q.lesson))&&(!diffs||diffs.includes(q.difficulty))).length) : Number(rawN);
      startSession(sampleQuestions({lessons,difficulties:diffs,count:n,excludeIds:avoid}), "weakness");
    } else if(mode==="simulation"){
      startSimulationExam();
    } else if(mode==="daily"){
      const seed = todayStr();
      const rnd = mulberry32(hashStr(seed));
      const picked = seededShuffle(DATA, rnd).slice(0,15);
      startSession(picked, "daily");
    }

function hashStr(s){ let h=1779033703; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }

/* ============ save & resume an in-progress session (سؤال واحد في كل مرة، لا رجوع) ============ */
function snapshotSession(){
  const s = state.session;
  if(!s){ return; }
  const snap = {
    mode: s.mode, qids: s.qs.map(q=>q.id), i: s.i, answers: s.answers,
    sessionStart: s.sessionStart, timeLimit: s.timeLimit||null,
    sections: s.sections? s.sections.map(sec=>({id:sec.id, title:sec.title, seconds:sec.seconds, startIdx:sec.startIdx, endIdx:sec.endIdx})) : null,
    curSec: (s.curSec!==undefined && s.curSec!==null) ? s.curSec : null,
    secRemaining: s.secTimerEnd!=null ? Math.max(0, Math.round((s.secTimerEnd-Date.now())/1000)) : null,
    savedAt: Date.now(),
  };
  save(SK.inProgress, snap);
}
function clearSessionSnapshot(){ save(SK.inProgress, null); }
function restoreSessionFromSnapshot(snap){
  const qs = snap.qids.map(id=>byId.get(id)).filter(Boolean);
  if(qs.length!==snap.qids.length) return false; // a referenced question vanished (shouldn't happen) — refuse a corrupt resume
  const s = { qs, i:Math.min(snap.i, qs.length-1), mode:snap.mode, answers:snap.answers||[], qStart:Date.now(),
    timeLimit:snap.timeLimit||null, sessionStart:snap.sessionStart, answered:false, timerId:null, qTimerId:null };
  if(snap.sections){
    s.sections = snap.sections;
    s.curSec = snap.curSec;
    s.secTimerEnd = snap.secRemaining!=null ? Date.now()+snap.secRemaining*1000 : null;
  }
  state.session = s;
  return true;
}
function startSession(questions, mode, opts){
  opts = opts||{};
  state.session = { qs:questions, i:0, mode, answers:[], qStart:Date.now(),
    timeLimit: opts.timeLimit||null, sessionStart:Date.now(), answered:false, timerId:null, qTimerId:null };
  go("quiz");
}
function currentQ(){ const s=state.session; return s.qs[s.i]; }
function currentSection(){
  const s = state.session;

let _attMisFlushTimer = null;
function scheduleAttMisSave(){
  // localStorage has no append mode: every write re-serializes the WHOLE array. For a student with a
  // real history (thousands of past answers), writing it fresh after every single question is O(history
  // size) per question — the main cause of lag/stutter when answering quickly. Debounce the write instead
  // of skipping it: still saved within 600ms of the last answer, but rapid consecutive answers coalesce
  // into one write. flushAttMisNow() guarantees an immediate, un-debounced save at every real checkpoint
  // (finishing a session, exiting, backgrounding the tab) so nothing is ever actually at risk of loss.
  clearTimeout(_attMisFlushTimer);
  _attMisFlushTimer = setTimeout(flushAttMisNow, 600);
}
function flushAttMisNow(){ clearTimeout(_attMisFlushTimer); save(SK.att, ATT); save(SK.mis, MIS); }
function recordAttempt(q, correct, ms, mode){
  ATT.push({qid:q.id, correct, ms, ts:Date.now(), chapter:q.chapter, lesson:q.lesson, skill:q.skill, difficulty:q.difficulty, mode});
  if(!correct){ if(!MIS[q.id]) MIS[q.id]={count:0,lastCorrect:false}; MIS[q.id].count++; MIS[q.id].lastCorrect=false; }
  else if(MIS[q.id]){ MIS[q.id].lastCorrect=true; }
  // only ATT/MIS actually changed here — saving all 12 stores on every single answer (the old persistAll()
  // call) was 6x heavier than needed on top of the O(n²) issue above.
  scheduleAttMisSave();
}
function finishSession(){
  const s = state.session; clearInterval(s.timerId); clearInterval(s.qTimerId);
  flushAttMisNow(); // guarantee the last answer(s) are actually saved before we compute/record the session summary
  clearSessionSnapshot();
  s.finishedAt = Date.now();
  s.totalMs = s.finishedAt - s.sessionStart;
  if(s.mode==="daily"){
    const today = todayStr(); const yest = addDays(today,-1);
    if(DAILY.lastDate!==today){
      DAILY.streak = (DAILY.lastDate===yest) ? DAILY.streak+1 : 1;
      DAILY.best = Math.max(DAILY.best, DAILY.streak);
      DAILY.lastDate = today;
    }
    const correct = s.answers.filter(a=>a.correct).length;
    DAILY.history[today] = {score:correct, total:s.qs.length};
    save(SK.daily, DAILY);
  }
  if(s.mode==="diagnostic"){
    const total = s.qs.length, correct = s.answers.filter(a=>a.correct).length;
    const pct = Math.round(100*correct/total);
    const avgMs = Math.round(s.answers.reduce((a,b)=>a+b.ms,0)/total);
    DIAG.push({ts:Date.now(), total, correct, pct, avgMs, tier:levelTier(pct)});
    save(SK.diag, DIAG);
  }
  if(s.mode==="simulation" && s.sections){
    const total = s.qs.length, correct = s.answers.filter(a=>a.correct).length;
    const pct = Math.round(100*correct/total);
    const avgMs = Math.round(s.answers.reduce((a,b)=>a+b.ms,0)/total);
    const sections = s.sections.map(sec=>{
      const secAns = s.answers.filter(a=>{
        const idx = s.qs.findIndex(q=>q.id===a.qid);
        return idx>=sec.startIdx && idx<=sec.endIdx;
      });
      const sT = secAns.length, sC = secAns.filter(a=>a.correct).length;
      return {title:sec.title, total:sT, correct:sC, pct: sT?Math.round(100*sC/sT):0, avgMs: sT?Math.round(secAns.reduce((a,b)=>a+b.ms,0)/sT):0};
    });
    SIMS.push({ts:Date.now(), total, correct, pct, avgMs, tier:levelTier(pct), sections});
    save(SK.sim, SIMS);
  }
  if(["diagnostic","practice","weakness","simulation","daily"].includes(s.mode)){
    try{ s.attemptRecord = recordAttemptHistory(s); }catch(e){ console.error("recordAttemptHistory failed:", e); }
    try{ snapshotReadiness(); }catch(e){ console.error("snapshotReadiness failed:", e); }
  }
  go("results");
}

/* ============ سجل المحاولات والتطور ============ */
function computeProgressStats(){
  // Handles 0 / 1 / 2 / many attempts, and stays correct after a deletion, by simply recomputing fresh
  // from ATTEMPT_HISTORY every time it's called — there is no separate cached/stored "progress" value.
  const chron = ATTEMPT_HISTORY.slice().sort((a,b)=>a.completedAt-b.completedAt);
  const n = chron.length;
  if(n===0) return {count:0};
  const startPct = chron[0].accuracy;
  const currentPct = chron[n-1].accuracy;
  const highest = Math.max(...chron.map(a=>a.accuracy));
  const avg = Math.round(chron.reduce((s,a)=>s+a.accuracy,0)/n);
  const delta = currentPct - startPct;
  let trendLabel = null;
  if(n>=2){
    const t = attemptsTrend(); // null when n<3
    trendLabel = t==="up"?"تحسن": t==="down"?"تراجع": t==="volatile"?"متذبذب": t==="flat"?"ثابت"
      : (delta>0?"تحسن":delta<0?"تراجع":"ثابت"); // n===2 fallback (attemptsTrend needs >=3)
  }
  return {count:n, startPct, currentPct, highest, avg, delta, trendLabel};
}
function skillProgressAnalysis(){
  const chron = ATTEMPT_HISTORY.slice().sort((a,b)=>a.completedAt-b.completedAt);
  const n = chron.length;
  if(n<2) return null;
  const mid = Math.ceil(n/2);
  const agg = list=>{
    const m = {};
    list.forEach(a=>Object.keys(a.skillBreakdown||{}).forEach(l=>{
      const s = a.skillBreakdown[l]; if(!m[l]) m[l]={correct:0,total:0};
      m[l].correct += s.correct; m[l].total += s.total;
    }));
    const out = {}; Object.keys(m).forEach(l=>{ if(m[l].total>0) out[l]=Math.round(100*m[l].correct/m[l].total); });
    return out;
  };
  const earlierAvg = agg(chron.slice(0,mid)), recentAvg = agg(chron.slice(mid));
  const improved = [], needsWork = [];
  new Set([...Object.keys(earlierAvg), ...Object.keys(recentAvg)]).forEach(l=>{
    if(recentAvg[l]===undefined) return;
    if(earlierAvg[l]!==undefined && recentAvg[l]-earlierAvg[l]>=8) improved.push({lesson:l, from:earlierAvg[l], to:recentAvg[l]});
    if(recentAvg[l]<65) needsWork.push({lesson:l, pct:recentAvg[l]});
  });
  improved.sort((a,b)=>(b.to-b.from)-(a.to-a.from));
  needsWork.sort((a,b)=>a.pct-b.pct);
  return {improved:improved.slice(0,5), needsWork:needsWork.slice(0,5)};
}
function deleteAttemptRecord(id){
  const idx = ATTEMPT_HISTORY.findIndex(a=>a.id===id);
  if(idx<0) return;
  ATTEMPT_HISTORY.splice(idx,1); // only this one record — bank/MIS/FAV/ACH/DIAG/SIMS are never touched here
  save(SK.attemptHistory, ATTEMPT_HISTORY);
  go("attemptsLog");
}
function renderAttemptsLog(){
  const name = studentName();
  const inProg = load(SK.inProgress, null);
  let html = `<h2 style="margin-bottom:4px">سجل المحاولات والتطور</h2>
    <p style="color:var(--muted);font-size:14px;margin-bottom:16px">${name? "تقرير أداء "+esc(name) : "كل محاولاتك المكتملة، من الأحدث إلى الأقدم"}</p>`;

  if(inProg){
    const typeLabel = ATTEMPT_TYPE_LABEL[MODE_TO_ATTEMPT_TYPE[inProg.mode]] || inProg.mode;
    const pct = Math.round(100*Math.min(inProg.i,inProg.qids.length)/inProg.qids.length);
    html += `<p class="section-t">اختبار غير مكتمل</p>
      <div class="note" style="margin-bottom:18px">
        <p><b>${esc(typeLabel)}</b></p>
        <p class="hint" style="margin:4px 0 10px">حللت ${Math.min(inProg.i,inProg.qids.length)} من ${inProg.qids.length} سؤالًا (${pct}%)</p>
        <div class="setup-actions" style="margin-top:0">
          <button class="btn btn-primary" id="resumeIncompleteBtn">متابعة الاختبار</button>
          <button class="btn btn-ghost" id="deleteIncompleteBtn">حذف الاختبار غير المكتمل</button>
        </div>
      </div>`;
  }

  const stats = computeProgressStats();
  if(stats.count>0){
    html += `<p class="section-t">مستوى التطور</p>
      <div class="card" style="margin-bottom:18px">
        <div class="bar-row"><span class="bar-l">المحاولات المكتملة</span><span class="num">${stats.count}</span></div>
        <div class="bar-row"><span class="bar-l">بدأت بنسبة</span><span class="num">${stats.startPct}%</span></div>
        <div class="bar-row"><span class="bar-l">مستواك الحالي</span><span class="num">${stats.currentPct}%</span></div>
        <div class="bar-row"><span class="bar-l">أعلى نتيجة</span><span class="num">${stats.highest}%</span></div>
        <div class="bar-row"><span class="bar-l">متوسط النتائج</span><span class="num">${stats.avg}%</span></div>
        ${stats.trendLabel? `<div class="bar-row"><span class="bar-l">التطور</span><span class="num" style="color:${stats.delta>0?"var(--good)":stats.delta<0?"var(--bad)":"var(--muted)"}">${stats.delta>0?"+":""}${stats.delta} نقطة</span></div>
        <div class="bar-row"><span class="bar-l">الاتجاه العام</span><span class="num">${esc(stats.trendLabel)}</span></div>`:""}
      </div>`;
    const sk = skillProgressAnalysis();
    if(sk && (sk.improved.length || sk.needsWork.length)){
      html += `<p class="section-t">تحليل تطورك</p><div class="card" style="margin-bottom:18px">`;
      if(sk.improved.length) html += `<p style="margin-bottom:8px"><b>تحسّنت فيها:</b> ${sk.improved.map(s=>`${esc(s.lesson)} (${s.from}%→${s.to}%)`).join("، ")}</p>`;
      if(sk.needsWork.length) html += `<p><b>ما زالت تحتاج تدريبًا:</b> ${sk.needsWork.map(s=>`${esc(s.lesson)} (${s.pct}%)`).join("، ")}</p>`;
      html += `</div>`;
    }
  }

  const list = ATTEMPT_HISTORY.slice().reverse(); // newest first
  if(!list.length){
    if(ATT.length>0){
      html += `<div class="empty">${icon("chart",34)}<p>لدينا ${ATT.length} سؤالًا محلولًا مسجَّلًا في سجلك، لكن لم يظهر ملخص جلسة كامل بعد.
        جرّب إكمال اختبار جديد من أوله إلى آخره ثم ارجع لهذه الصفحة.</p></div>`;
    } else {
      html += `<div class="empty">${icon("chart",34)}<p>لسا ما عندك محاولات مسجَّلة — ابدأ أي جلسة تدريب أو اختبار وبتلقاها هنا.</p></div>`;
    }
  } else {
    if(list.length>=3){
      const chron = list.slice().reverse();
      html += `<p class="section-t">تطور أدائي</p>
        <div class="sparkwrap" style="margin-bottom:8px">${sparklineSvg(chron.map(a=>a.accuracy))}</div>
        <p class="hint" style="margin-bottom:14px">الدقة عبر ${chron.length} محاولة، من الأقدم إلى الأحدث.</p>`;
    }
    if(list.length>=2){
      html += `<button class="btn btn-ghost" id="compareBtn" style="margin-bottom:16px">${icon("shuffle",16)} مقارنة المحاولات</button>`;
    }
    html += `<p class="section-t">كل المحاولات</p>`;
    html += list.map((a,i)=>{
      const realIdx = list.length-1-i; // index into chronological ATTEMPT_HISTORY
      const prev = realIdx>0 ? ATTEMPT_HISTORY[realIdx-1] : null;
      const deltaTxt = !prev ? "خط الأساس" : (()=>{ const d=a.accuracy-prev.accuracy;
        return d===0? "بدون تغيير عن المحاولة السابقة" : (d>0?`↑ +${d} نقطة عن المحاولة السابقة`:`↓ ${d} نقطة عن المحاولة السابقة`); })();
      const deltaColor = !prev ? "var(--muted)" : (a.accuracy-prev.accuracy>0?"var(--good)":a.accuracy-prev.accuracy<0?"var(--bad)":"var(--muted)");
      return `<div class="item">
        <div class="item-top"><p class="item-stem">${esc(relativeDateLabel(a.date))} · ${esc(ATTEMPT_TYPE_LABEL[a.type]||a.type)}</p></div>
        <div class="item-meta"><span>الدقة: ${a.accuracy}%</span><span>صحيح: ${a.correctAnswers}</span><span>خطأ: ${a.incorrectAnswers}</span><span>الزمن: ${fmtDuration(a.totalTime)}</span><span>${a.totalQuestions} سؤالًا</span>${a.levelAtTime?`<span>${esc(a.levelAtTime)}</span>`:""}</div>
        <p class="hint" style="color:${deltaColor};margin-top:4px">${deltaTxt}</p>

      </div>`;
    }).join("");
  }
  document.getElementById("app").innerHTML = html + dashboardBackLinkHtml() + brandFooterHtml();
  const cb = document.getElementById("compareBtn"); if(cb) cb.onclick = ()=>go("compareSetup");
  const rib = document.getElementById("resumeIncompleteBtn");
  if(rib) rib.onclick = ()=>{ if(restoreSessionFromSnapshot(inProg)) go("quiz"); else { clearSessionSnapshot(); go("attemptsLog"); } };
  const dib = document.getElementById("deleteIncompleteBtn");
  if(dib) dib.onclick = ()=> showConfirmModal("حذف الاختبار غير المكتمل؟","سيُحذف تقدمك في هذا الاختبار ولن تستطيع استئنافه.","حذف","تراجع",
    ()=>{ clearSessionSnapshot(); go("attemptsLog"); });
  document.querySelectorAll(".delAttemptLink").forEach(a=>a.onclick=()=>
    showConfirmModal("هل أنت متأكد من حذف هذه المحاولة؟","لا يمكن التراجع عن هذا الإجراء.","حذف","تراجع", ()=>deleteAttemptRecord(a.dataset.delid)));
  bindDashboardBackLink();
}

/* ============ مقارنة المحاولات ============ */
function renderCompareSetup(){
  const list = ATTEMPT_HISTORY.slice().reverse();
  document.getElementById("app").innerHTML = `
    <h2 style="margin-bottom:6px">مقارنة المحاولات</h2>
    <p style="color:var(--muted);font-size:14px;margin-bottom:14px">اختر محاولتين بالضبط للمقارنة بينهما.</p>
    <div id="cmpList">${list.map((a,i)=>{
      const realIdx = list.length-1-i;
      return `<label class="item" style="display:flex;align-items:center;gap:12px;cursor:pointer">
        <input type="checkbox" class="cmpChk" data-idx="${realIdx}" style="width:20px;height:20px;accent-color:var(--accent);flex:none">
        <div><div class="item-stem">${esc(relativeDateLabel(a.date))} · ${esc(ATTEMPT_TYPE_LABEL[a.type]||a.type)}</div>
        <div class="item-meta"><span>الدقة: ${a.accuracy}%</span><span>${a.totalQuestions} سؤالًا</span></div></div>
      </label>`;
    }).join("")}</div>
    <p class="hint" id="cmpErr" style="color:var(--bad)"></p>
    <button class="btn btn-primary" id="cmpGoBtn" style="margin-top:10px">قارن</button>
    <div class="setup-actions" style="margin-top:10px"><button class="btn btn-ghost" id="backToLog2">العودة لسجل المحاولات</button></div>
    ${brandFooterHtml()}`;
  document.getElementById("cmpGoBtn").onclick = ()=>{
    const checked = [...document.querySelectorAll(".cmpChk")].filter(c=>c.checked).map(c=>Number(c.dataset.idx));
    if(checked.length!==2){ document.getElementById("cmpErr").textContent = "اختر محاولتين بالضبط لا أكثر ولا أقل."; return; }
    go("compareResult", {idxA:Math.min(...checked), idxB:Math.max(...checked)});
  };
  document.getElementById("backToLog2").onclick = ()=>go("attemptsLog");
}
function cmpRow(label, a, b, betterHigh, unit){
  unit = unit || "";
  let delta = "—", style = "";
  if(a!==b){
    const d = b-a;
    const good = betterHigh===null ? null : (betterHigh? d>0 : d<0);
    delta = (d>0?"+":"") + d + unit;
    if(good===true) style = "color:var(--good)"; else if(good===false) style = "color:var(--bad)";
  }
  return `<tr><td>${esc(label)}</td><td>${a}${unit}</td><td>${b}${unit}</td><td style="${style}">${delta}</td></tr>`;
}
function renderCompareResult(){
  const A = ATTEMPT_HISTORY[state.params.idxA], B = ATTEMPT_HISTORY[state.params.idxB];
  if(!A || !B){ go("attemptsLog"); return; }
  const name = studentName();
  const rows = [
    cmpRow("الدقة", A.accuracy, B.accuracy, true, "%"),
    cmpRow("متوسط الزمن (ث)", Math.round(A.averageTime/1000), Math.round(B.averageTime/1000), false),
    cmpRow("عدد الأخطاء", A.incorrectAnswers, B.incorrectAnswers, false),
    cmpRow("عدد الأسئلة", A.totalQuestions, B.totalQuestions, null),
  ];
  const skills = [...new Set([...Object.keys(A.skillBreakdown), ...Object.keys(B.skillBreakdown)])];
  const skillRows = skills.map(l=>{
    const pa = A.skillBreakdown[l]? A.skillBreakdown[l].pct : null;
    const pb = B.skillBreakdown[l]? B.skillBreakdown[l].pct : null;
    return `<div class="bar-row"><span class="bar-l">${esc(l)}</span>
      <span style="font-size:13.5px;color:var(--muted);flex:none">${pa===null?"—":pa+"%"} → ${pb===null?"—":pb+"%"}</span></div>`;
  }).join("");
  document.getElementById("app").innerHTML = `
    <h2 style="margin-bottom:4px">مقارنة المحاولات</h2>
    <p style="color:var(--muted);font-size:14px;margin-bottom:16px">${name? "تقرير أداء "+esc(name) : ""}</p>
    <table class="tb" style="width:100%;margin-bottom:18px">
      <thead><tr><th>المؤشر</th><th>${esc(relativeDateLabel(A.date))}</th><th>${esc(relativeDateLabel(B.date))}</th><th>التغير</th></tr></thead>
      <tbody>${rows.join("")}</tbody>
    </table>
    <p class="section-t">مقارنة المهارات</p>
    <div class="card">${skillRows || "<p style='color:var(--muted)'>لا توجد مهارات مشتركة كافية للمقارنة.</p>"}</div>
    <div class="setup-actions" style="margin-top:20px"><button class="btn btn-ghost" id="backToLog">العودة لسجل المحاولات</button></div>
    ${brandFooterHtml()}`;
  document.getElementById("backToLog").onclick = ()=>go("attemptsLog");
}

function renderAchievements(){
  checkAchievements();
  document.getElementById("app").innerHTML = `<h2 style="margin-bottom:14px">الإنجازات (${Object.keys(ACH).length}/${ACHIEVEMENTS.length})</h2>
    <div class="ach-grid">${ACHIEVEMENTS.map(a=>`
      <div class="ach ${ACH[a.id]?"":"locked"}"><span class="ic">${icon(ACH[a.id]?a.icon:"lock",22)}</span>
      <div><div class="ach-t">${esc(a.t)}</div><div class="ach-d">${esc(a.d)}</div></div></div>`).join("")}
    </div>
    ${dashboardBackLinkHtml()}`;

}

/* ============ multi-profile resolution (runs once, before the first render) ============
   One device can hold several fully-isolated student profiles. GK.users is the registry (who exists),
   GK.active is which one is currently active. Everything else on this page (ATT, PROFILE, etc.) is loaded
   through SK, which is built fresh for whichever profile is active — see buildSK()/loadUserData() above. */
function safeLocalGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } } // never throws, even if storage is blocked entirely
function safeLocalSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function runMigrationIfNeeded(){
  if(load(GK.users, null)) return; // already on the multi-profile system (migrated or a fresh install that already ran this)
  const legacyKeyMap = {att:"mq_attempts", mis:"mq_mistakes", fav:"mq_favorites", daily:"mq_daily", ach:"mq_achievements",
    diag:"mq_diag_history", goal:"mq_goal", sim:"mq_sim_history", readinessHist:"mq_readiness_history",
    profile:"mq_student_profile", attemptHistory:"mq_attempt_history", inProgress:"mq_in_progress_session"};
  let legacyProfile = null;
  try{ const raw = safeLocalGet(legacyKeyMap.profile); if(raw) legacyProfile = JSON.parse(raw); }catch(e){}
  const hasLegacyData = legacyProfile || safeLocalGet(legacyKeyMap.att) || safeLocalGet(legacyKeyMap.attemptHistory);
  if(!hasLegacyData){ save(GK.users, []); return; } // brand-new install, nothing to carry over
  const uid = newUserId();
  const dest = buildSK(uid);
  Object.keys(legacyKeyMap).forEach(k=>{
    const raw = safeLocalGet(legacyKeyMap[k]);
    if(raw!=null) safeLocalSet(dest[k], raw); // copy once — legacy keys are left in place, untouched, never re-read again
  });
  save(GK.users, [{userId:uid, name:(legacyProfile&&legacyProfile.name)||"", createdAt:(legacyProfile&&legacyProfile.createdAt)||Date.now()}]);
  save(GK.active, uid);
}
function resolveActiveProfile(){
  runMigrationIfNeeded();
  let users = load(GK.users, []);
  let activeUid = load(GK.active, null);
  if(activeUid && !users.some(u=>u.userId===activeUid)) activeUid = null; // pointer to a profile that no longer exists
  if(activeUid){
    SK = buildSK(activeUid);
    loadUserData();
    if(!load(GK.onboarded,false)) state.view = "welcome";
    else if(!PROFILE.name) state.view = "profileSetup";
    else if(load(SK.inProgress,null)) state.view = "resume";
    else { PROFILE.lastActiveAt = Date.now(); save(SK.profile, PROFILE); state.view = "dashboard"; }
  } else if(users.length>0){
    state.view = "userPicker"; // profiles exist on this device, none active (explicit logout) — let the student choose
  } else {
    const uid = newUserId();
    users = [{userId:uid, name:"", createdAt:Date.now()}];
    save(GK.users, users); save(GK.active, uid);
    SK = buildSK(uid);
    loadUserData(); // all empty defaults for a brand-new profile
    state.view = load(GK.onboarded,false) ? "profileSetup" : "welcome";
  }
}
resolveActiveProfile();
updateStorageBanner();
render();
if(CLOUD_SYNC_ENABLED) cloudInit();
if(typeof document.addEventListener==="function"){
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ flushAttMisNow(); cloudPush(); } });
}
